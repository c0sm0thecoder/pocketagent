name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste your bot token, API keys or private code.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Send a voice note…\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pocketagent version
      placeholder: output of `pocketagent version`
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and adapter type
      placeholder: "e.g. gemini (acp), aider (command)"
  - type: textarea
    id: doctor
    attributes:
      label: Output of `pocketagent doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (`pocketagent logs`)
      description: Remove anything private first.
      render: text
