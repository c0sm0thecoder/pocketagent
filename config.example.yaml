# pocketagent config. Copy to ~/.pocketagent/config.yaml (or run `pocketagent init`).
# ${VAR} is replaced with the environment variable VAR, so secrets can stay out of this file.

telegram:
  token: ${TELEGRAM_BOT_TOKEN}       # from @BotFather
  allowed_users: [123456789]         # numeric user ids; message @userinfobot to get yours

defaults:
  agent: claude
  cwd: ~/projects
  mode: ask                          # ask | edits | plan | yolo

# Tool kinds approved without asking (in every mode except when the agent
# itself prompts): read, search, think, fetch, edit, execute, delete, move, other
auto_allow: [read, search, think]
approval_timeout: 10m

# Three agent types:
#   claude:  the Claude Code CLI driven directly (fastest, reports cost)
#   acp:     any Agent Client Protocol agent; approvals, images and models come
#            through the protocol. Models are discovered from the agent too.
#   command: any CLI that takes a prompt and prints a reply.
# Optional on every agent: model (default), models (picker list), env, wrap.
agents:
  claude:
    type: claude
    command: claude
    models: [opus, sonnet, haiku]

  codex:
    type: acp
    command: [npx, -y, "@zed-industries/codex-acp"]

  # gemini:
  #   type: acp
  #   command: [gemini, --acp]
  # kiro:
  #   type: acp
  #   command: [kiro-cli, acp]
  # goose:
  #   type: acp
  #   command: [goose, acp]
  # opencode:
  #   type: acp
  #   command: [opencode, acp]
  # copilot:
  #   type: acp
  #   command: [copilot, --acp, --stdio]
  # claude-acp:                      # Claude Code through ACP instead of natively
  #   type: acp
  #   command: [npx, -y, "@agentclientprotocol/claude-agent-acp"]

  # aider:
  #   type: command
  #   command: [aider, --message, "{prompt}", --yes-always, --no-pretty, --no-stream]
  #   model_args: [--model, "{model}"]   # added when a model is chosen
  #   image_args: ["{path}"]             # added once per attached image
  #   models: [sonnet, gpt-5, deepseek]
  #   timeout: 30m
  # my-script:
  #   type: command
  #   command: [./ask.sh]
  #   stdin: true                        # prompt on stdin instead of {prompt}

  # Sandbox any agent by wrapping its command, e.g. in Docker (see docs/sandbox.md):
  #   wrap: [docker, run, --rm, -i, -v, "{cwd}:{cwd}", -w, "{cwd}", my-agent-image]

# Named workspaces, switchable with /project.
projects:
  pocketagent:
    cwd: ~/projects/pocketagent
  # api: { cwd: ~/work/api, agent: codex, model: gpt-5, mode: edits }

transcriber:
  type: whisper-cpp                  # whisper-cpp | openai | command | none
  model: ~/.pocketagent/models/ggml-small.bin
  language: auto
  # OpenAI-compatible (OpenAI, Groq, a local faster-whisper server, ...):
  # type: openai
  # base_url: https://api.groq.com/openai/v1
  # api_key: ${GROQ_API_KEY}
  # model: whisper-large-v3-turbo

tts:
  type: none                         # say (macOS) | openai | command | none
  # type: openai
  # api_key: ${OPENAI_API_KEY}
  # model: gpt-4o-mini-tts
  # voice: alloy

budget:
  daily_usd: 0                       # per user; 0 = unlimited

output:
  file_threshold: 8000               # replies longer than this are sent as a .md file

checkpoints: true                    # git snapshot before each turn, for /diff and /undo
