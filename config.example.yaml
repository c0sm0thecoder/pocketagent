# pocketagent config. `pocketagent init` writes one for you; this file
# documents every option. Copy it to ~/.pocketagent/config.yaml to start
# from here instead.
#
# ${VAR} is replaced with the environment variable VAR, so secrets can stay
# out of this file.

telegram:
  token: ${TELEGRAM_BOT_TOKEN}       # from @BotFather
  allowed_users: [123456789]         # numeric user ids allowed to use the bot

defaults:
  agent: aider                       # optional; the first agent by name otherwise
  cwd: ~/projects
  mode: ask                          # ask | edits | plan | full

permissions:
  # Tool kinds that run without asking:
  # read, search, think, fetch, edit, move (execute and delete always ask
  # unless the mode is full).
  auto_allow: [read, search, think]
  timeout: 10m                       # unanswered approvals are denied

# Agents. Keep the ones installed on your machine.
#
# Every agent has:
#   type     the adapter: acp | claude-code | command
#   command  the program to run (a string or a list)
#   model    default model (optional)
#   models   models offered in the /model picker (optional)
#   env      extra environment, as KEY=VALUE (optional)
#   wrap     a prefix for command, e.g. a container runner; {cwd} is the
#            working directory (optional, see docs/sandbox.md)
# plus options of its adapter:
#   acp:         modes (map of pocketagent mode to the agent's mode ids),
#                idle_timeout
#   command:     model_args, image_args, stdin, timeout; the command may
#                use {prompt}, {cwd} and {model}
#   claude-code: none
agents:
  aider:
    type: command
    command: [aider, --message, "{prompt}", --yes-always, --no-pretty, --no-stream]
    model_args: [--model, "{model}"]
    image_args: ["{path}"]
    timeout: 30m

  claude-code:
    type: claude-code
    command: claude
    models: [opus, sonnet, haiku]

  codex:
    type: acp
    command: [npx, -y, "@zed-industries/codex-acp"]

  copilot:
    type: acp
    command: [copilot, --acp, --stdio]

  cursor:
    type: acp
    command: [cursor-agent, acp]

  gemini:
    type: acp
    command: [gemini, --acp]

  goose:
    type: acp
    command: [goose, acp]

  kiro:
    type: acp
    command: [kiro-cli, acp]

  opencode:
    type: acp
    command: [opencode, acp]

  # Any other ACP agent, with its mode ids mapped explicitly:
  # my-agent:
  #   type: acp
  #   command: [my-agent, --acp]
  #   modes: {edits: [auto-edit], full: [unrestricted]}

# Named workspaces, switchable with /project. You can also add existing
# folders from chat with `/project add`; those are kept in the state file
# and a project here with the same name takes precedence.
projects:
  website:
    cwd: ~/projects/website
  # api: { cwd: ~/work/api, agent: gemini, model: some-model, mode: edits }

# Voice messages. type: whisper-cpp | http | command | none
transcriber:
  type: whisper-cpp                  # local and private
  model: ~/.pocketagent/models/ggml-small.bin
  language: auto
  # binary: whisper-cli
  # ffmpeg: ffmpeg
  #
  # Any service with an OpenAI-compatible /audio/transcriptions endpoint
  # (hosted or self-hosted):
  # type: http
  # base_url: https://transcription.example.com/v1
  # api_key: ${TRANSCRIPTION_API_KEY}
  # model: whisper-large-v3
  #
  # Any program that prints a transcript; {file} is the audio file:
  # type: command
  # command: [my-stt, "{file}"]

# Spoken replies, toggled with /voice. type: say | http | command | none
tts:
  type: none
  # type: say                        # macOS
  # voice: Samantha
  #
  # Any service with an OpenAI-compatible /audio/speech endpoint:
  # type: http
  # base_url: https://speech.example.com/v1
  # api_key: ${SPEECH_API_KEY}
  # model: some-tts-model
  # voice: some-voice
  #
  # Any program; {text_file} is the input, {out} the audio file it writes:
  # type: command
  # command: [my-tts, "{text_file}", "{out}"]

budget:
  daily_usd: 0                       # per user; 0 = unlimited

output:
  file_threshold: 8000               # longer replies are sent as a file

checkpoints: true                    # git snapshot before each turn, for /diff and /undo

# bridge_host: host.docker.internal  # only when agents run in containers
