<text x="470" y="162" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#A5B4FC">in your pocket.</text>
<circle cx="477" cy="223" r="5" fill="#A5B4FC"/>
<text x="494" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB">Speak, type or send a screenshot</text>
<text x="494" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">Voice is transcribed on your machine.</text>
<circle cx="477" cy="291" r="5" fill="#A5B4FC"/>
<text x="494" y="296" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB">Any agent, any model</text>
<text x="494" y="318" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">ACP agents and any CLI, any model.</text>
<circle cx="477" cy="359" r="5" fill="#A5B4FC"/>
<text x="494" y="364" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB">Approve with a tap</text>
<text x="494" y="386" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">Or reply to say what to do instead.</text>
<circle cx="477" cy="427" r="5" fill="#A5B4FC"/>
<text x="494" y="432" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB">Undo anything</text>
<text x="494" y="454" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">Every turn is a git checkpoint.</text>
