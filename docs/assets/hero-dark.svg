<rect x="84" y="488" width="302" height="28" rx="14" fill="#0B1120" stroke="#374151"/>
<text x="100" y="506" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">/diff    /undo    /agent    /mode</text>
